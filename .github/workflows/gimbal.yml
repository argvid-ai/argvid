name: Gimbal project checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware compile (arduino-cli 1.5.1, esp32 core 3.3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install arduino-cli 1.5.1 (pinned)
        run: |
          curl -fsSL -o /tmp/arduino-cli.tar.gz https://downloads.arduino.cc/arduino-cli/arduino-cli_1.5.1_Linux_64bit.tar.gz
          sudo tar -xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin arduino-cli
          arduino-cli version
      - name: Install esp32 core 3.3.11 and ArduinoJson 7.4.3 (pinned)
        run: |
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install ArduinoJson@7.4.3
      - name: Compile ESP32-S3 firmware
        run: >-
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc
          projects/gen0-gimbal/src/firmware/esp32-firmware

  app:
    name: Flutter app unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flutter SDK (stable)
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Run app unit tests
        run: |
          cd projects/gen0-gimbal/src/app
          flutter --version
          flutter pub get
          flutter test

  tools:
    name: Python tools and project manifest checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile Python tool modules
        run: >-
          python3 -m py_compile projects/gen0-gimbal/src/tools/f32c_protocol.py
          projects/gen0-gimbal/src/tools/test_cli.py
          projects/gen0-gimbal/src/tools/web_app.py
      - name: Run project manifest check
        run: python3 tools/project-check projects/gen0-gimbal
