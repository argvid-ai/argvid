name: Feature or RFC request
description: Propose a public capability, contract, or workflow improvement
title: "proposal: "
labels: ["proposal", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Public issues are publication. Review rights before posting. Larger features, security-sensitive changes, protocol changes, and new upstream projects need maintainer-confirmed scope via an Issue or approved public-safe task brief before implementation. Ordinary small fixes may directly prepare a PR. A contributor cannot self-authorize reserved changes; shared contracts still need root RFC review. Report vulnerabilities via SECURITY.md. An Agent cannot grant publication/IP permission; excluded material must not be posted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or interoperability problem without prescribing a solution.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and constraints
      description: State the public inclusion basis, data/licenses, affected six-layer/four-plane areas, and safety/compatibility constraints.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Include alternatives, non-goals, project/module paths, and whether a root RFC is needed. Projects must not copy shared protocol schemas.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable checks and required human approvals. A proposal alone is not maintainer scope confirmation or a release; unrun HIL is pending. Do not upload chats, full Agent prompts, or personnel details.
    validations:
      required: true
