; PlatformIO 配置（Arduino IDE 用户可直接打开 esp32-firmware.ino 编译烧录，无需 PlatformIO）
; 烧录前需在 Arduino 库管理器安装 ArduinoJson（bblanchon/ArduinoJson）

[platformio]
src_dir = .

[env:esp32-s3-devkitc-1]
; 工具链固定版本（评审要求可复现构建）：espressif32 7.0.1 = Arduino core 2.0.17
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DBOARD_HAS_PSRAM
